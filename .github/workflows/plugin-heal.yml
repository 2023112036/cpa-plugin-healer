name: heal-plugins  
  
on:  
  schedule:  
    - cron: "*/10 * * * *"   # 每10分钟检查一次（UTC 时间）  
  workflow_dispatch:          # 在 Actions 页面手动触发  
  
jobs:  
  heal:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Reinstall unregistered plugins  
        env:  
          BASE: ${{ secrets.CPA_BASE_URL }}  
          KEY:  ${{ secrets.CPA_MANAGEMENT_KEY }}  
        run: |  
          set -e  
          resp=$(curl -sf -H "Authorization: Bearer $KEY" "$BASE/v0/management/plugins")  
          echo "$resp" | jq .  
          ids=$(echo "$resp" | jq -r '.plugins[] | select(.configured and .enabled and (.registered|not)) | .id')  
          if [ -z "$ids" ]; then  
            echo "all plugins healthy"  
            exit 0  
          fi  
          for id in $ids; do  
            printf '%s' "$id" | od -An -c 
            printf 'URL=[%q]\n' "$BASE/v0/management/plugin-store/$id/install"  
            echo "BASE len=${#BASE} KEY len=${#KEY}"
            echo "scheme=[${BASE:0:8}]"
            echo "len_before=${#BASE}" 
            BASE="$(printf '%s' "${BASE%/}" | tr -d '[:space:]')"  
            echo "len_after=${#BASE}"
            printf '%s' "$BASE" | LC_ALL=C od -An -tx1 
            echo "=== reinstalling $id ==="  
            curl -sS -v -w "\nHTTP %{http_code}\n" -X POST -H "Authorization: Bearer $KEY"  "$BASE/v0/management/plugin-store/$id/install"  
          done
          echo "=== final status ==="  
          sleep 10  
          curl -sS -H "Authorization: Bearer $KEY" "$BASE/v0/management/plugins" | jq -r '.plugins[] | "\(.id): path=\(.path) registered=\(.registered) effective=\(.effective_enabled)"'
